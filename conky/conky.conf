${offset ]]..settings.graph_gap..[[}${diskiograph_read ]]..settings.drive_name_1..' '..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Storage:${alignc}${fs_used ]]..settings.drive_path[1]..[[} / ${fs_size ]]..settings.drive_path[1]..[[}${alignr}${fs_used_perc ]]..settings.drive_path[1]..[[}%
I/O:${alignr}${diskio_write ]]..settings.drive_name_1..[[} / ${diskio_read ]]..settings.drive_name_1..[[}

${endif}\
