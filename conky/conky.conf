I/O:${alignr}${diskio_write ]]..settings.drive_name_4..[[} / ${diskio_read ]]..settings.drive_name_4..[[}

]]

local text_battery = [[
#======= Battery Info ========
${voffset ]]..(settings.icon_height + settings.graph_offset)..[[}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
${if_match "${battery_status ]]..settings.battery_id..[[}" == "unknown"}\
Stand-by:${alignr}${battery_percent ]]..settings.battery_id..[[}%\
${else}\
${startcase ${battery_status ]]..settings.battery_id..[[}}:${alignr}${battery_percent ]]..settings.battery_id..[[}%\
${endif}
]]

local text_content = text_cpu..text_ram..text_gpu..text_temp..text_fans

if settings.number_of_drives == 1 then
  text_content = text_content..text_drive_1
elseif settings.number_of_drives == 2 then
  text_content = text_content..text_drive_1..text_drive_2
elseif settings.number_of_drives == 3 then
  text_content = text_content..text_drive_1..text_drive_2..text_drive_3
elseif settings.number_of_drives == 4 then
  text_content = text_content..text_drive_1..text_drive_2..text_drive_3..text_drive_4
end

if settings.display_battery_info == 1 then
  text_content = text_content..text_battery
end

conky.text = text_content
