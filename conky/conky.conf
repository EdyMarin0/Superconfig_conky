${offset ]]..settings.graph_gap..[[}${diskiograph_read ]]..settings.drive_name_2..' '..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Storage:${alignc}${fs_used ]]..settings.drive_path[2]..[[} / ${fs_size ]]..settings.drive_path[2]..[[}${alignr}${fs_used_perc ]]..settings.drive_path[2]..[[}%
I/O:${alignr}${diskio_write ]]..settings.drive_name_2..[[} / ${diskio_read ]]..settings.drive_name_2..[[}

${endif}\
#
# #== Drive 3 ==
${if_match ]]..settings.number_of_drives..[[ >= 3}\
${offset ]]..(settings.icon_width  + settings.icon_gap)..[[}${voffset ]]..settings.graph_offset..[[}${diskiograph_write ]]..settings.drive_name_3..' '..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}\
${offset ]]..settings.graph_gap..[[}${diskiograph_read ]]..settings.drive_name_3..' '..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Storage:${alignc}${fs_used ]]..settings.drive_path[3]..[[} / ${fs_size ]]..settings.drive_path[3]..[[}${alignr}${fs_used_perc ]]..settings.drive_path[3]..[[}%
I/O:${alignr}${diskio_write ]]..settings.drive_name_3..[[} / ${diskio_read ]]..settings.drive_name_3..[[}

${endif}\
#
# #== Drive 4 ==
${if_match ]]..settings.number_of_drives..[[ >= 4}\
${offset ]]..(settings.icon_width  + settings.icon_gap)..[[}${voffset ]]..settings.graph_offset..[[}${diskiograph_write ]]..settings.drive_name_4..' '..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}\
${offset ]]..settings.graph_gap..[[}${diskiograph_read ]]..settings.drive_name_4..' '..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Storage:${alignc}${fs_used ]]..settings.drive_path[4]..[[} / ${fs_size ]]..settings.drive_path[4]..[[}${alignr}${fs_used_perc ]]..settings.drive_path[4]..[[}%
I/O:${alignr}${diskio_write ]]..settings.drive_name_4..[[} / ${diskio_read ]]..settings.drive_name_4..[[}\
${endif}
]]
conky.text = text_cpu..text_ram..text_gpu..text_temp..text_fans..text_storage
