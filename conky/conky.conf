
-- loading universal settings
local home = os.getenv('HOME')
package.path = package.path .. ';' .. home .. '/.config/conky/?.lua'
local settings = require 'settings'

conky.config = {
  -- window behaviour
  own_window = true,
  own_window_type = 'normal',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_title = 'ConkyMain',

  -- window appearance
  xinerama_head = settings.monitor,

  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = settings.window_transparency,
  own_window_colour = settings.window_color,

  alignment = settings.window_position,
  gap_x = settings.window_x,
  gap_y = settings.window_y,
  minimum_height = settings.window_height,
  minimum_width = settings.window_width,
  maximum_width = settings.window_width,
  border_width = settings.window_border_distance,
  border_inner_margin = 0,
  border_outer_margin = 0,
  draw_blended = true,

  -- window rendering
  update_interval = settings.main_update_interval,
  double_buffer = true,
  draw_shades = false,
  draw_graph_borders = false,

  -- colors
  color1 = settings.main_color,
  color2 = settings.accent_color_1,
  color3 = settings.accent_color_2,
  color4 = settings.high_temp_color,

  -- font
  use_xft = true,
  font = settings.font,
  default_color = settings.text_color,
  temperature_unit = 'celsius',

  -- graph sizing
  default_graph_width = settings.graph_width,
  default_graph_height = settings.graph_height,

  -- CPU bar graph + icon rendering
  lua_load = home..'/.config/conky/scripts/cpu_columns.lua;'..home..'/.config/conky/scripts/gpu.lua',
  lua_draw_hook_post = 'cpu_columns',

};

local text_cpu = [[
#======= CPU ========
${offset ]]..(settings.icon_width  + settings.icon_gap)..[[}${voffset ]]..settings.graph_offset..[[}${cpugraph cpu0 ]]..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Total CPU usage:${alignr}${cpu cpu0}%
]]

local text_ram = [[
#======= RAM ========
${voffset ]]..(settings.bar_height + settings.line_height)..[[}${offset ]]..(settings.icon_width  + settings.icon_gap)..[[}${voffset ]]..settings.graph_offset..[[}${memgraph ]]..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Used:${alignc}${mem} / ${memmax}${alignr}${memperc}%

]]

local text_gpu = [[
#======= GPU ======== update to native variables on next version update
${offset ]]..(settings.icon_width  + settings.icon_gap)..[[}${voffset ]]..settings.graph_offset..[[}${execgraph "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits" ]]..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
Total GPU usage:${alignr}${lua_parse gpu_util}%
VRAM:${alignc}${lua_parse gpu_mem_used}GiB / ${lua_parse gpu_mem_total}GiB${alignr}${lua_parse gpu_mem_perc}%

]]

local text_temp = [[
#======= Temp ========
${offset ]]..(settings.icon_width  + settings.icon_gap)..[[}${voffset ]]..settings.graph_offset..[[}${execgraph "sensors ]]..settings.cpu_temp_chip..[[ | grep -m1 -oP ']]..settings.cpu_temp_label..[[:\s*\+\K[0-9.]+'" ]]..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}\
${offset ]]..settings.graph_gap..[[}${execgraph "nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits" ]]..settings.graph_height..','..settings.graph_half_width..' '..settings.low_color..' '..settings.high_color..[[ -t}
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
CPU Temp:${alignr}${hwmon ]]..settings.cpu_temp_sensor..' temp '..settings.cpu_temp_index..[[}°C
GPU Temp:${alignr}${lua_parse gpu_temp}°C

]]

local text_fans = [[
#======= Fans ========
${voffset ]]..settings.horizontal_line_offset..[[}${color2}${hr ]]..settings.horizontal_line_thickness..' '..settings.window_width..[[}${color}
CPU Fan:${alignr}${hwmon ]]..settings.fan_chip..[[ fan ]]..settings.cpu_fan_id..[[} RPM
GPU Fan:${alignr}${hwmon ]]..settings.fan_chip..[[ fan ]]..settings.gpu_fan_id..[[} RPM

]]

